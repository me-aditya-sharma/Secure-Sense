<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecureSense — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">

    <div class="brand-mark">
      <div class="brand-mark__badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Z"/>
          <path d="M9 12.5l2 2 4-4.5"/>
        </svg>
      </div>
      <div class="brand-mark__text">
        <h1>SecureSense</h1>
        <div class="brand-mark__lines">
          <span>Built by Code Crushers</span>
          <span>Smart India Hackathon 2026</span>
        </div>
      </div>
    </div>

    <div class="auth-heading">
      <h2>Choose a demo account</h2>
      <p>Select a profile to sign in to the fraud-detection console.</p>
    </div>

    <div class="user-list">

      <button type="button" class="user-card" data-user-card data-name="Ananya Rao" data-phone="+91 98XXX XXX21" data-role="Senior Fraud Analyst">
        <div class="user-card__avatar">AR</div>
        <div class="user-card__body">
          <div class="user-card__name">Ananya Rao</div>
          <div class="user-card__phone">+91 98XXX XXX21</div>
        </div>
        <svg class="user-card__chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m9 18 6-6-6-6"/>
        </svg>
      </button>

      <button type="button" class="user-card" data-user-card data-name="Vikram Sethi" data-phone="+91 99XXX XXX47" data-role="Compliance Officer">
        <div class="user-card__avatar">VS</div>
        <div class="user-card__body">
          <div class="user-card__name">Vikram Sethi</div>
          <div class="user-card__phone">+91 99XXX XXX47</div>
        </div>
        <svg class="user-card__chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m9 18 6-6-6-6"/>
        </svg>
      </button>

      <button type="button" class="user-card" data-user-card data-name="Priya Menon" data-phone="+91 97XXX XXX08" data-role="Risk Investigator">
        <div class="user-card__avatar">PM</div>
        <div class="user-card__body">
          <div class="user-card__name">Priya Menon</div>
          <div class="user-card__phone">+91 97XXX XXX08</div>
        </div>
        <svg class="user-card__chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m9 18 6-6-6-6"/>
        </svg>
      </button>

    </div>

    <ul class="footnote-tags">
      <li>Prototype build</li>
      <li>Demo data only</li>
      <li>No real authentication</li>
    </ul>

  </div>
</div>

<script src="js/main.js"></script>
</body>
</html>
